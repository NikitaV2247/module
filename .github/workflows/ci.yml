name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Линтеры (black / isort / flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: black --check
        run: black --check src tests
      - name: isort --check-only
        run: isort --check-only src tests
      - name: flake8
        run: flake8 src tests

  test:
    name: Тесты и покрытие (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit-тесты с покрытием
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing -q
      - name: Дымовой запуск CLI
        run: |
          python -m src.main --group 4-1П9 --day Понедельник
          python -m src.main --group 4-1П9 --week
          python -m src.main --conflicts
      - name: Архив отчёта о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error

  teacher-conflicts:
    name: Конфликты преподавателя (ретро-действие issue #30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Тесты конфликтов преподавателя
        run: pytest tests/test_conflicts.py -k teacher -q
      - name: Отчёт --conflicts на демо-данных
        run: |
          python -m src.main --conflicts | grep -q "Конфликт преподавателя"
          python -m src.main --conflicts | grep -q "Конфликтов найдено: 5"
