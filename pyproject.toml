[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''(
    /(\.venv|\.git|\.pytest_cache|__pycache__|exports|assets)/
)'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
skip_glob = ["assets/*", "exports/*"]
